name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Repo Variables (Settings → Secrets and variables → Actions → Variables):
#   PUBLIC_SITE_URL   e.g. https://baruch-landing-multi-demo.luisrodz.dev
#   PUBLIC_BASE_PATH  /   (root — required for custom subdomain)
#   PUBLIC_CONTACT_API_URL  (optional; Pages is static and does not run server APIs)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build with Astro
        uses: withastro/action@v6
        with:
          path: .
          package-manager: bun
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}
          PUBLIC_CONTACT_API_URL: ${{ vars.PUBLIC_CONTACT_API_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
