name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Optional build env (set in repo Variables/Secrets if needed):
#   PUBLIC_SITE_URL, PUBLIC_BASE_PATH, PUBLIC_CONTACT_API_URL
# Without them, astro.config.mjs infers site/base from GITHUB_REPOSITORY in Actions.
# Pages is static and does not run server APIs.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build with Astro
        uses: withastro/action@v6
        with:
          path: .
          package-manager: bun

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
